name: Aspire Samples CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.gitignore"
      - "**/*.gitattributes"

  pull_request:
  workflow_dispatch:

  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASPIRE_CLI_VERSION: '13.6.0'
  NODE_VERSION: '24.18.0'

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            dotnet_install_dir: ''
          - os: windows-2025
            dotnet_install_dir: 'dotnet'
    runs-on: ${{ matrix.os }}
    name: Build & Test Samples
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      DOTNET_MULTILEVEL_LOOKUP: false
      DOTNET_INSTALL_DIR: ${{ matrix.dotnet_install_dir }}
      ASPIRE_ALLOW_UNSECURED_TRANSPORT: true
      ASPIRE_CLI_TELEMETRY_OPTOUT: true
      SuppressNETCoreSdkPreviewMessage: true
      DCP_DIAGNOSTICS_LOG_LEVEL: 'debug'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  
    - name: Install Docker (latest version)
      if: runner.os == 'Linux'
      uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0

    - name: Install Azure Functions Core Tools
      if: runner.os == 'Linux'
      run: |
        wget -q https://packages.microsoft.com/config/ubuntu/20.04/packages-microsoft-prod.deb
        sudo dpkg -i packages-microsoft-prod.deb
        sudo apt-get update
        sudo apt-get install -y azure-functions-core-tools-4

    - name: Install .NET SDK (global.json)
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: ./build/global.json
    
    - name: Print .NET info
      working-directory: ./build
      run: dotnet --info

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ env.NODE_VERSION }}

    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '21'

    - name: Install Aspire CLI (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        install_path="$RUNNER_TEMP/aspire-cli"
        curl -fsSL https://aspire.dev/install.sh | bash -s -- --install-path "$install_path" --version "$ASPIRE_CLI_VERSION" --skip-path
        echo "$install_path" >> "$GITHUB_PATH"
        echo "ASPIRE_CLI=$install_path/aspire" >> "$GITHUB_ENV"
        "$install_path/aspire" --version

    - name: Install Aspire CLI (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $installScript = Join-Path $env:RUNNER_TEMP 'aspire-install.ps1'
        $installPath = Join-Path $env:RUNNER_TEMP 'aspire-cli'
        $aspirePath = Join-Path $installPath 'aspire.exe'

        Invoke-RestMethod 'https://aspire.dev/install.ps1' -OutFile $installScript
        & $installScript -InstallPath $installPath -Version $env:ASPIRE_CLI_VERSION -SkipPath

        $installPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "ASPIRE_CLI=$aspirePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        & $aspirePath --version

    - name: Install & trust dev-certs
      id: install-dev-certs
      # Trusting certs on Windows throws a prompt so will halt the build
      if: runner.os == 'Linux'
      shell: bash
      working-directory: ./build
      run: |
        trust_dir="$HOME/.aspnet/dev-certs/trust"
        echo "SSL_CERT_DIR=$trust_dir:/usr/lib/ssl/certs" >> "$GITHUB_ENV"
        SSL_CERT_DIR="$trust_dir:/usr/lib/ssl/certs" dotnet dev-certs https --trust

    - name: Validate JavaScript packages
      if: runner.os == 'Linux'
      shell: bash
      run: bash ./build/validate-javascript.sh

    - name: Test Spring Petclinic API
      shell: pwsh
      working-directory: ./samples/spring-petclinic/api
      run: |
        $mavenWrapper = if ($IsWindows) { '.\mvnw.cmd' } else { './mvnw' }
        & $mavenWrapper test

    - name: Build (Ubuntu)
      if: runner.os == 'Linux'
      working-directory: ./build
      run: ./build.sh -p:SkipTypeScriptRestore=true

    - name: Build (Windows)
      if: runner.os == 'Windows'
      working-directory: ./build
      run: .\build.cmd

    - name: Copy binlog files
      if: always()
      shell: pwsh
      run: |
        $repositoryRoot = (Get-Location).Path
        $binlogFiles = Get-ChildItem -Path . -Filter *.binlog -Recurse
        if ($binlogFiles.Count -gt 0) {
          $buildLogs = Join-Path $repositoryRoot 'BuildLogs'
          foreach ($file in $binlogFiles) {
            $relativePath = [System.IO.Path]::GetRelativePath($repositoryRoot, $file.FullName)
            $destination = Join-Path $buildLogs $relativePath
            New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
            Copy-Item -Path $file.FullName -Destination $destination
            Write-Host "Copied: $relativePath"
          }
        } else {
          Write-Host "No .binlog files found"
        }

    - name: Publish binlog files
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: BuildLogs_${{ matrix.os }}
        path: ./BuildLogs
        if-no-files-found: ignore

    - name: Test
      id: test
      # We only test on Ubuntu because Windows agents don't support Docker with WSL
      if: runner.os == 'Linux'
      timeout-minutes: 20
      working-directory: ./tests
      # Note that the space after the last double dash (--) is intentional
      run: >
        dotnet test ./SamplesTests.slnx
        --logger console --logger trx --logger GitHubActions
        --results-directory ../TestResults --blame
        -- 
        RunConfiguration.CollectSourceInformation=true

    - name: Copy DCP logs
      if: always() && runner.os == 'Linux'
      run: |
        mkdir -p ./TestResults/DCPLogs
        TEMP_DIR="${TMPDIR:-/tmp}"
        if [ -d "$TEMP_DIR/dcp/logs" ]; then
          cp -a "$TEMP_DIR/dcp/logs/." ./TestResults/DCPLogs/
        else
          echo "No DCP logs found"
        fi
    
    - name: Publish Test Results
      if: always() && runner.os == 'Linux'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: TestResults_${{ matrix.os }}
        path: ./TestResults
        if-no-files-found: ignore

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      # Every required validation job must be listed here.
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Verify required jobs succeeded
      shell: bash
      env:
        BUILD_RESULT: ${{ needs.build.result }}
      run: |
        if [ "$BUILD_RESULT" != "success" ]; then
          echo "::error::Build & Test Samples completed with '$BUILD_RESULT'"
          exit 1
        fi
