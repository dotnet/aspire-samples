id: auto.merge
name: GitOps.PullRequestIssueManagement
description: Auto-merge pull requests labeled 'auto-merge' after the required CI Gate passes
owner:
resource: repository
disabled: false
where:
configuration:
  resourceManagementConfiguration:
    eventResponderTasks:

      - description: >-
          Approve and auto-squash-merge PRs to main labeled 'auto-merge'.
          The label is only applied automatically to Dependabot PRs (see label-prs.yml),
          so this effectively gates auto-merge to bot-authored or maintainer-opted-in PRs.
          Branch protection requires CI Gate to pass on the PR branch without
          requiring it to be up to date with main before merging.
        triggerOnOwnActions: true
        if:
          - payloadType: Pull_Request
          - labelAdded:
              label: auto-merge
          - targetsBranch:
              branch: main
        then:
          - enableAutoMerge:
              mergeMethod: Squash
          - approvePullRequest:
              comment: "Approved; this PR will merge after the required CI Gate passes."

      - description: Disable auto-merge when the 'auto-merge' label is removed
        if:
          - payloadType: Pull_Request
          - labelRemoved:
              label: auto-merge
        then:
          - disableAutoMerge
